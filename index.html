<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Project HERO · 플레이</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#11151d;color:#f5e8d0;font-family:system-ui,sans-serif;overflow:hidden}main{width:min(100vw,56.25dvh);height:100dvh;margin:auto;position:relative;background:#171d27}canvas{width:100%;height:100%;display:block;touch-action:none;outline:none}#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:linear-gradient(#17202b,#15121b);text-align:center;padding:25px;gap:18px}h1{font-size:30px;letter-spacing:.15em;margin:0}p{color:#baa98d;font-size:14px;line-height:1.6;margin:0}button{border:1px solid #c7a464;background:#705326;color:white;border-radius:10px;padding:14px 40px;font-size:18px;cursor:pointer}progress{width:80%;accent-color:#c7a464}#error{white-space:pre-wrap;color:#ffbfbf;font-size:13px;max-height:35vh;overflow:auto}#proof-panel{position:fixed;top:0;left:0;max-width:32vw;background:#000c;color:#fff;font-size:10px;pointer-events:none}pre{white-space:pre-wrap}</style></head>
<body><main><canvas id="game" width="540" height="960" tabindex="0" aria-label="Project HERO 게임 화면"></canvas><div id="loading"><h1>PROJECT HERO</h1><p id="status">PC 브라우저 검수용 · 첫 로딩 약 307MiB</p><button id="start">게임 시작</button><progress id="progress" value="0" max="1" hidden></progress><p id="error" hidden></p></div></main>
<aside id="proof-panel" hidden><pre id="runtime-proof">게임 시작 대기</pre></aside>
<script>

const nativeFetch=window.fetch.bind(window);
const byUrl=new Map(Object.entries(heroChunks).map(([path,value])=>[new URL(path,document.baseURI).href,value]));
window.fetch=async function(input,options){
  const parsed=new URL(input instanceof Request?input.url:String(input),document.baseURI);parsed.search='';
  const url=parsed.href;
  const entry=byUrl.get(url);if(!entry)return nativeFetch(input,options);
  const headers={'Content-Type':'application/octet-stream','Content-Length':String(entry.bytes),'Last-Modified':entry.lastModified,'ETag':'"'+entry.sha256+'"'};

<script>
const config={"dataUrl": "Build/WebPreview.data.unityweb", "frameworkUrl": "Build/WebPreview.framework.js.unityweb", "codeUrl": "Build/WebPreview.wasm.unityweb", "streamingAssetsUrl": "StreamingAssets", "companyName": "Project HERO", "productName": "Project HERO", "productVersion": "web-preview-v1", "devicePixelRatio": 1, "matchWebGLToCanvasSize": true};
const load=document.getElementById('loading'),statusText=document.getElementById('status'),bar=document.getElementById('progress'),button=document.getElementById('start');
let heroGame;
const errors=[];
function fail(message){errors.push(String(message));const el=document.getElementById('error');el.textContent=String(message);el.hidden=false;statusText.textContent='게임을 불러오지 못했어요';button.textContent='다시 시도';button.hidden=false;button.onclick=()=>location.reload();}
window.addEventListener('error',e=>{if(e.message)fail(e.message)});
window.addEventListener('unhandledrejection',e=>fail(e.reason));
window.addEventListener('hero-runtime-sample',e=>{document.getElementById('runtime-proof').textContent=JSON.stringify({...e.detail,browserErrors:errors},null,2)});
if(new URLSearchParams(location.search).has('qa'))document.getElementById('proof-panel').hidden=false;
button.onclick=()=>{button.hidden=true;bar.hidden=false;statusText.textContent='전장을 불러오는 중…';const script=document.createElement('script');script.src="Build/WebPreview.loader.js";script.onerror=()=>fail('게임 실행 파일을 불러오지 못했어요');script.onload=()=>createUnityInstance(document.getElementById('game'),config,p=>{bar.value=p;statusText.textContent='전장을 불러오는 중… '+Math.round(p*100)+'%';}).then(instance=>{heroGame=instance;load.style.display='none';document.getElementById('game').focus();}).catch(fail);document.body.appendChild(script)};
</script></body></html>
